name: Deploy Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::568919814221:role/GitHubActions-LambdaDeploy
          aws-region: eu-central-1

      - name: Deploy Lambda
        run: |
          zip -j lambda.zip resume-lambda-func.py
          aws lambda update-function-code \
            --function-name resume-lambda-func \
            --zip-file fileb://lambda.zip
